name: Feature request
 description: Suggest an idea or improvement
 title: "[Feature]: "
 labels: []
 body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Describe the problem or opportunity this would address.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem or limitation.
      placeholder: I'm frustrated when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, mockups, or other context here.
    validations:
      required: false
